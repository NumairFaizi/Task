<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Daily Quest 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Playfair+Display:ital,wght@1,600;1,800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-dark: #07080d;
            --card-glass: rgba(13, 17, 28, 0.75);
            --border-glass: rgba(255, 255, 255, 0.06);
            --neon-pink: #ff4757;
            --neon-purple: #8b5cf6;
            --neon-cyan: #06b6d4;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            margin: 0;
            padding: 15px 15px 95px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        header {
            text-align: center;
            margin: 25px 0 10px 0;
            width: 100%;
            max-width: 480px;
            z-index: 10;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-weight: 800;
            margin: 0 0 6px 0;
            font-size: 2.4rem;
            background: linear-gradient(135deg, #be93fd, #ff4757, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        header p {
            margin: 0;
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .score-board {
            background: rgba(13, 17, 28, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(139, 92, 246, 0.25);
            padding: 12px 45px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            margin: 20px 0;
            display: inline-flex;
            align-items: center;
            gap: 14px;
            z-index: 10;
        }

        .score-label {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .score-val {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-primary);
            text-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            z-index: 10;
        }

        .app-page {
            display: none;
            animation: appSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .app-page.active {
            display: block;
        }

        @keyframes appSlideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .section-header h2 {
            font-size: 1.25rem;
            font-weight: 800;
            margin: 0;
            color: var(--text-primary);
        }

        .card-item {
            background: var(--card-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 12px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .card-item:hover {
            border-color: rgba(6, 182, 212, 0.3);
            background: rgba(19, 26, 43, 0.8);
        }

        .card-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .item-info {
            flex: 1;
        }

        .item-info h3 {
            margin: 0 0 4px 0;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.4;
        }

        .item-info p {
            margin: 0 0 6px 0;
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .points-badge {
            background: rgba(255, 255, 255, 0.04);
            color: var(--neon-cyan);
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-block;
            border: 1px solid rgba(6, 182, 212, 0.15);
        }

        button {
            font-family: inherit;
            background: linear-gradient(135deg, var(--neon-purple), #6366f1);
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.82rem;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.2);
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(139, 92, 246, 0.4);
        }

        button:active:not(:disabled) {
            transform: scale(0.95);
        }

        button:disabled {
            background: rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.12);
            box-shadow: none;
            cursor: not-allowed;
            border: 1px solid rgba(255, 255, 255, 0.01);
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-primary);
            font-size: 0.75rem;
            padding: 6px 12px;
            border-radius: 12px;
            box-shadow: none;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .btn-reset:hover { background: rgba(255, 255, 255, 0.06); }

        .text-response-container {
            margin-top: 12px;
            width: 100%;
        }

        .love-text-box {
            width: 100%;
            height: 75px;
            padding: 12px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(7, 8, 13, 0.6);
            font-family: inherit;
            font-size: 0.85rem;
            color: var(--text-primary);
            resize: none;
            outline: none;
            transition: all 0.25s;
        }

        .love-text-box:focus {
            border-color: var(--neon-purple);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
        }

        .saved-response-box {
            margin-top: 10px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.02);
            border-left: 3px solid var(--neon-purple);
            border-radius: 4px 14px 14px 4px;
            font-size: 0.85rem;
            font-style: italic;
            color: var(--text-primary);
            line-height: 1.4;
        }

        .upload-container {
            margin-top: 12px;
        }
        .upload-container input[type=file] { display: none; }

        .file-drop-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.01);
            border: 2px dashed rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            transition: all 0.2s;
        }
        .file-drop-zone:hover {
            background: rgba(255, 255, 255, 0.02);
            border-color: var(--neon-cyan);
            color: var(--text-primary);
        }

        .preview-img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 16px;
            margin-top: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            display: none;
        }

        .bottom-nav {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 30px);
            max-width: 440px;
            background: rgba(13, 17, 28, 0.9);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 6px;
            display: flex;
            justify-content: space-around;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 8px 20px;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 18px;
            box-shadow: none;
            transition: all 0.2s ease;
            gap: 2px;
        }

        .nav-item span.icon { font-size: 1.2rem; }

        .nav-item.active {
            background: rgba(255, 255, 255, 0.04);
            color: var(--neon-pink);
        }

        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .feed-card {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--border-glass);
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .feed-card.complete { border-left: 3px solid var(--neon-cyan); }
        .feed-card.redeem { border-left: 4px solid var(--neon-pink); }
        .feed-time { font-size: 0.75rem; color: var(--text-secondary); font-weight: 600; }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <header>
        <h1>Our Daily Quest</h1>
        <p>Complete goals, claim custom packages</p>
        <div class="score-board">
            <span class="score-label">Balance</span>
            <span class="score-val" id="total-points">0</span>
        </div>
    </header>

    <div class="app-container">
        
        <div id="page-tasks" class="app-page active">
            <div class="section-header">
                <h2>Daily Goals</h2>
                <button class="btn-reset" id="admin-reset-btn">🔄 New Day</button>
            </div>
            <div id="tasks-list"></div>
        </div>

        <div id="page-rewards" class="app-page">
            <div class="section-header">
                <h2>Rewards Shop</h2>
            </div>
            <div id="rewards-list"></div>
        </div>

        <div id="page-history" class="app-page">
            <div class="section-header">
                <h2>Activity Timeline</h2>
            </div>
            <div id="feed-list" class="feed-container"></div>
        </div>

    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('page-tasks', this)">
            <span class="icon">✨</span>
            <span>Tasks</span>
        </button>
        <button class="nav-item" onclick="switchTab('page-rewards', this)">
            <span class="icon">🎁</span>
            <span>Shop</span>
        </button>
        <button class="nav-item" onclick="switchTab('page-history', this)">
            <span class="icon">📜</span>
            <span>History</span>
        </button>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDEtBDUm2kPHwYh_tOxSF5OY-0esUoOBcs",
            authDomain: "task-quest-numair.firebaseapp.com",
            projectId: "task-quest-numair",
            storageBucket: "task-quest-numair.firebasestorage.app",
            messagingSenderId: "389105697902",
            appId: "1:389105697902:web:e3c644eba49704157ed27f",
            measurementId: "G-V5RHL2N8Z2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Core Task Array
        const tasks = [
            { id: 'task1', title: 'Send a sweet morning text ☀️', points: 10, type: 'text-inout' },
            { id: 'task2', title: 'Upload a cute selfie of today 🤳', points: 30, type: 'upload' },
            { id: 'task3', title: 'Tell me one thing you love about me today 🥰', points: 20, type: 'text-input' },
            { id: 'task4', title: 'Give me a long eye contact when we see each other! 🤗', points: 40, type: 'standard' }
        ];

        // Adjusted Rewards Tier Structure
        const rewards = [
            { id: 'reward1', title: 'Midnight Drive + Late Night Chai 🚗☕', cost: 50, desc: 'A quiet, winding cruise through the city lights, ending with a hot cup of tea together.' },
            { id: 'reward2', title: '100 Rs in next Eidi ✉️💰', cost: 300, desc: 'Unlock a bonus tier addition straight into your upcoming festive Eidi pouch.' },
            { id: 'reward3', title: 'A Custom Premium Gift Package Box 🎁👑', cost: 400, desc: 'Unlock a beautifully curated bundle containing premium lifestyle choices you have had your eye on.' },
            { id: 'reward4', title: 'Exclusive Platinum Diamond Ring Luxury Choice 💍💎', cost: 500, desc: 'An ultra-exclusive, premium custom statement ring setting added permanently to your fine registry.' }
        ];

        let appData = { points: 0, completedTasks: {}, logs: [] };
        const docRef = doc(db, "questHub", "sharedState");

        onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
                appData = docSnap.data();
            } else {
                setDoc(docRef, appData);
            }
            updateUI();
        });

        // Background Animation Core Engine 
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class GridParticle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.2;
                this.speedY = (Math.random() - 0.5) * 0.3;
                this.alpha = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = '#8b5cf6';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#06b6d4';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function initBG() {
            particles = [];
            for (let i = 0; i < 45; i++) {
                particles.push(new GridParticle());
            }
        }
        initBG();

        function animateBG() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.015)';
            ctx.lineWidth = 1;
            const gridSpacing = 60;
            for(let x = 0; x < canvas.width; x += gridSpacing) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for(let y = 0; y < canvas.height; y += gridSpacing) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateBG);
        }
        animateBG();

        window.switchTab = function(pageId, navButton) {
            document.querySelectorAll('.app-page').forEach(page => page.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(pageId).classList.add('active');
            navButton.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateUI() {
            document.getElementById('total-points').innerText = appData.points || 0;

            const tasksList = document.getElementById('tasks-list');
            tasksList.innerHTML = '';
            tasks.forEach(task => {
                const taskStatus = appData.completedTasks?.[task.id];
                const isCompleted = !!taskStatus;
                const card = document.createElement('div');
                card.className = 'card-item';

                let extraHTML = '';
                if (task.type === 'upload') {
                    if (!isCompleted) {
                        extraHTML = `
                            <div class="upload-container">
                                <label class="file-drop-zone" for="file-${task.id}">
                                    <span style="font-size:1.3rem; margin-bottom:4px;">📸</span>
                                    <span>Select today's layout target</span>
                                    <input type="file" id="file-${task.id}" accept="image/*">
                                </label>
                                <img id="preview-${task.id}" class="preview-img" />
                            </div>
                        `;
                    } else {
                        extraHTML = `<img src="${taskStatus}" class="preview-img" style="display:block;" />`;
                    }
                } else if (task.type === 'text-input') {
                    if (!isCompleted) {
                        extraHTML = `
                            <div class="text-response-container">
                                <textarea id="text-input-${task.id}" class="love-text-box" placeholder="Acknowledge response log... ❤️"></textarea>
                            </div>
                        `;
                    } else {
                        extraHTML = `
                            <div class="saved-response-box">
                                "${taskStatus}"
                            </div>
                        `;
                    }
                }

                card.innerHTML = `
                    <div class="card-body">
                        <div class="item-info">
                            <h3>${task.title}</h3>
                            <span class="points-badge">+${task.points} PTS</span>
                        </div>
                        <button id="btn-${task.id}" ${isCompleted ? 'disabled' : ''}>
                            ${isCompleted ? '⚡ Logged' : 'Complete'}
                        </button>
                    </div>
                    ${extraHTML}
                `;
                tasksList.appendChild(card);

                if (!isCompleted) {
                    if (task.type === 'upload') {
                        card.querySelector(`#file-${task.id}`).addEventListener('change', () => handleImageUpload(task.id));
                    }
                    card.querySelector(`#btn-${task.id}`).addEventListener('click', () => completeTask(task, task.points, task.type));
                }
            });

            const rewardsList = document.getElementById('rewards-list');
            rewardsList.innerHTML = '';
            rewards.forEach(reward => {
                const currentPoints = appData.points || 0;
                const canAfford = currentPoints >= reward.cost;
                const card = document.createElement('div');
                card.className = 'card-item';
                card.innerHTML = `
                    <div class="card-body">
                        <div class="item-info">
                            <h3>${reward.title}</h3>
                            <p>${reward.desc}</p>
                            <span class="points-badge" style="color:var(--neon-pink); border-color: rgba(255, 71, 87, 0.2);">${reward.cost} PTS</span>
                        </div>
                        <button ${!canAfford ? 'disabled' : ''} id="rew-${reward.id}" style="background:${canAfford ? 'linear-gradient(135deg, var(--neon-pink), #ff6b81)' : ''}; box-shadow: ${canAfford ? '0 4px 12px rgba(255, 71, 87, 0.3)' : ''};">
                            🎁 Unlock
                        </button>
                    </div>
                `;
                rewardsList.appendChild(card);
                if (canAfford) {
                    card.querySelector(`#rew-${reward.id}`).addEventListener('click', () => redeemReward(reward.title, reward.cost));
                }
            });

            const feedList = document.getElementById('feed-list');
            if(appData.logs && appData.logs.length > 0) {
                feedList.innerHTML = appData.logs.map(log => `
                    <div class="feed-card ${log.type || 'complete'}">
                        <span style="font-weight:600; color: var(--text-primary);">${log.text}</span>
                        <span class="feed-time">${log.time}</span>
                    </div>
                `).join('');
            } else {
                feedList.innerHTML = `<div class="feed-card" style="justify-content:center; color:var(--text-secondary);">No milestones logged yet! ✨</div>`;
            }
        }

        let temporaryImageString = "";
        function handleImageUpload(taskId) {
            const fileInput = document.getElementById(`file-${taskId}`);
            const preview = document.getElementById(`preview-${taskId}`);
            const file = fileInput.files[0];

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    temporaryImageString = e.target.result; 
                }
                reader.readAsDataURL(file);
            }
        }

        async function completeTask(task, taskPoints, type) {
            let taskPayloadValue = true;
            let customLogText = `=== Action Verified: "${task.title}" ===`;

            if (type === 'upload') {
                if (!temporaryImageString) {
                    alert('Please select an asset target first!');
                    return;
                }
                taskPayloadValue = temporaryImageString;
                temporaryImageString = "";
            } else if (type === 'text-input') {
                const inputElement = document.getElementById(`text-input-${task.id}`);
                const userText = inputElement.value.trim();
                if (!userText) {
                    alert('Please input a valid response log! 🥰');
                    return;
                }
                taskPayloadValue = userText;
                customLogText = `💌 Heartbeat Update: "${userText}"`;
            }

            const updatedCompleted = { ...(appData.completedTasks || {}) };
            updatedCompleted[task.id] = taskPayloadValue;

            const timeString = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            const newLog = { text: customLogText, time: timeString, type: 'complete' };
            const updatedLogs = [newLog, ...(appData.logs || [])].slice(0, 25);

            confetti({ particleCount: 140, spread: 65, colors: ['#8b5cf6', '#ff4757', '#06b6d4'], origin: { y: 0.7 } });

            await updateDoc(docRef, {
                points: (appData.points || 0) + taskPoints,
                completedTasks: updatedCompleted,
                logs: updatedLogs
            });
        }

        async function redeemReward(rewardTitle, cost) {
            if (appData.points >= cost) {
                const timeString = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const newLog = { text: `🔓 Package Triggered: "${rewardTitle}"`, time: timeString, type: 'redeem' };
                const updatedLogs = [newLog, ...(appData.logs || [])].slice(0, 25);

                confetti({ particleCount: 180, spread: 100, colors: ['#ff4757', '#8b5cf6', '#ffffff'] });

                await updateDoc(docRef, {
                    points: appData.points - cost,
                    logs: updatedLogs
                });
            }
        }

        document.getElementById('admin-reset-btn').addEventListener('click', async () => {
            if(confirm("Ready to drop new daily tasks? Your points balance won't change!")) {
                await updateDoc(docRef, { completedTasks: {} });
            }
        });
    </script>
