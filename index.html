<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Daily Quest 💖</title>
    <!-- Premium Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Playfair+Display:ital,wght@1,600;1,800&display=swap" rel="stylesheet">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --romance-primary: #ff3860;
            --romance-glow: rgba(255, 56, 96, 0.35);
            --gold-accent: #f59e0b;
            --velvet-text: #1e1b4b;
            --muted-rose: #881337;
            --glass-card: rgba(255, 241, 242, 0.55);
            --glass-border: rgba(255, 255, 255, 0.7);
        }

        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(-45deg, #ffe4e6, #fbcfe8, #f472b6, #ffe4e6);
            background-size: 300% 300%;
            animation: romanticFlow 18s ease infinite;
            color: var(--velvet-text);
            margin: 0;
            padding: 15px 15px 95px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        @keyframes romanticFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            text-align: center;
            margin: 25px 0 10px 0;
            width: 100%;
            max-width: 480px;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-weight: 800;
            margin: 0 0 6px 0;
            font-size: 2.3rem;
            background: linear-gradient(135deg, #9f1239, #be123c, #e11d48);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(225, 29, 72, 0.05);
        }

        header p {
            margin: 0;
            font-size: 0.95rem;
            color: var(--muted-rose);
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .score-board {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            padding: 14px 40px;
            border-radius: 40px;
            box-shadow: 0 15px 35px var(--romance-glow), inset 0 2px 4px rgba(255,255,255,0.8);
            margin: 20px 0;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            animation: gentleHeartbeat 2.5s ease-in-out infinite;
        }

        @keyframes gentleHeartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); box-shadow: 0 18px 40px rgba(255, 56, 96, 0.45); }
        }

        .score-label {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--muted-rose);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .score-val {
            font-size: 2.1rem;
            font-weight: 800;
            color: var(--romance-primary);
            text-shadow: 0 2px 8px rgba(255, 56, 96, 0.2);
        }

        .app-container {
            width: 100%;
            max-width: 480px;
        }

        .app-page {
            display: none;
            animation: softSlideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .app-page.active {
            display: block;
        }

        @keyframes softSlideUp {
            from { opacity: 0; transform: translateY(12px); filter: blur(4px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding: 0 6px;
        }

        .section-header h2 {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.45rem;
            font-weight: 700;
            margin: 0;
            color: #4c0519;
        }

        .card-item {
            background: var(--glass-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 10px 30px rgba(159, 18, 57, 0.04);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .card-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(159, 18, 57, 0.08);
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(255, 56, 96, 0.2);
        }

        .card-body {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 14px;
        }

        .item-info {
            flex: 1;
        }

        .item-info h3 {
            margin: 0 0 6px 0;
            font-size: 1.05rem;
            font-weight: 700;
            color: #4c0519;
            line-height: 1.4;
        }

        .item-info p {
            margin: 0 0 10px 0;
            font-size: 0.85rem;
            color: #881337;
            line-height: 1.45;
        }

        .points-badge {
            background: #ffe4e6;
            color: var(--romance-primary);
            padding: 4px 12px;
            border-radius: 14px;
            font-size: 0.78rem;
            font-weight: 700;
            display: inline-block;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 56, 96, 0.1);
        }

        button {
            font-family: inherit;
            background: linear-gradient(135deg, #ff3860, #e11d48);
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 18px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            box-shadow: 0 6px 16px var(--romance-glow);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        button:hover:not(:disabled) {
            background: linear-gradient(135deg, #e11d48, #be123c);
            box-shadow: 0 8px 20px rgba(225, 29, 72, 0.4);
        }

        button:active:not(:disabled) {
            transform: scale(0.93);
        }

        button:disabled {
            background: rgba(244, 63, 94, 0.08);
            color: rgba(159, 18, 57, 0.3);
            box-shadow: none;
            cursor: not-allowed;
            border: 1px solid rgba(159, 18, 57, 0.05);
        }

        .btn-reset {
            background: rgba(159, 18, 57, 0.06);
            color: #9f1239;
            font-size: 0.78rem;
            padding: 7px 14px;
            border-radius: 16px;
            box-shadow: none;
            font-weight: 600;
        }
        .btn-reset:hover { background: rgba(159, 18, 57, 0.12); }

        .text-response-container {
            margin-top: 14px;
            width: 100%;
        }

        .love-text-box {
            width: 100%;
            height: 80px;
            padding: 14px;
            border-radius: 18px;
            border: 1px solid rgba(255, 56, 96, 0.2);
            background: rgba(255, 255, 255, 0.6);
            font-family: inherit;
            font-size: 0.88rem;
            color: var(--velvet-text);
            resize: none;
            outline: none;
            transition: all 0.3s;
        }

        .love-text-box:focus {
            border-color: var(--romance-primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(255, 56, 96, 0.12);
        }

        .saved-response-box {
            margin-top: 12px;
            padding: 14px;
            background: rgba(255, 255, 255, 0.85);
            border-left: 4px solid var(--romance-primary);
            border-radius: 6px 20px 20px 6px;
            font-size: 0.88rem;
            font-style: italic;
            color: #4c0519;
            line-height: 1.5;
            box-shadow: 0 4px 15px rgba(159, 18, 57, 0.02);
        }

        .upload-container {
            margin-top: 14px;
        }
        .upload-container input[type=file] { display: none; }

        .file-drop-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 18px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.45);
            border: 2px dashed rgba(255, 56, 96, 0.25);
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            color: #881337;
            transition: all 0.25s;
        }
        .file-drop-zone:hover {
            background: rgba(255, 255, 255, 0.75);
            border-color: var(--romance-primary);
        }

        .preview-img {
            width: 100%;
            max-height: 260px;
            object-fit: cover;
            border-radius: 20px;
            margin-top: 14px;
            border: 4px solid white;
            box-shadow: 0 10px 30px rgba(159, 18, 57, 0.12);
            display: none;
            animation: softSlideUp 0.4s ease;
        }

        .bottom-nav {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 30px);
            max-width: 440px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 32px;
            padding: 6px;
            display: flex;
            justify-content: space-around;
            box-shadow: 0 15px 45px rgba(159, 18, 57, 0.15);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            color: #9f1239;
            opacity: 0.55;
            padding: 10px 22px;
            font-weight: 700;
            font-size: 0.78rem;
            cursor: pointer;
            border-radius: 24px;
            box-shadow: none;
            transition: all 0.3s ease;
            gap: 3px;
        }

        .nav-item span.icon { font-size: 1.3rem; }

        .nav-item.active {
            background: white;
            color: var(--romance-primary);
            opacity: 1;
            box-shadow: 0 6px 16px rgba(159, 18, 57, 0.06);
        }

        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .feed-card {
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid var(--glass-border);
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 0.88rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.01);
        }
        .feed-card.complete { border-left: 4px solid #10b981; }
        .feed-card.redeem { border-left: 4px solid var(--gold-accent); }
        .feed-time { font-size: 0.75rem; color: #9f1239; font-weight: 600; opacity: 0.7; }
    </style>
</head>
<body>

    <header>
        <h1>Our Daily Quest</h1>
        <p>A beautiful space built just for us</p>
        <div class="score-board">
            <span class="score-label">Balance</span>
            <span class="score-val" id="total-points">0</span>
        </div>
    </header>

    <div class="app-container">
        
        <!-- PAGE 1: TASKS -->
        <div id="page-tasks" class="app-page active">
            <div class="section-header">
                <h2>Daily Goals</h2>
                <button class="btn-reset" id="admin-reset-btn">🔄 New Day</button>
            </div>
            <div id="tasks-list"><!-- Injected --></div>
        </div>

        <!-- PAGE 2: REWARDS -->
        <div id="page-rewards" class="app-page">
            <div class="section-header">
                <h2>Rewards Shop</h2>
            </div>
            <div id="rewards-list"><!-- Injected --></div>
        </div>

        <!-- PAGE 3: HISTORY -->
        <div id="page-history" class="app-page">
            <div class="section-header">
                <h2>Activity Timeline</h2>
            </div>
            <div id="feed-list" class="feed-container"><!-- Injected --></div>
        </div>

    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('page-tasks', this)">
            <span class="icon">✨</span>
            <span>Tasks</span>
        </button>
        <button class="nav-item" onclick="switchTab('page-rewards', this)">
            <span class="icon">🎁</span>
            <span>Shop</span>
        </button>
        <button class="nav-item" onclick="switchTab('page-history', this)">
            <span class="icon">📜</span>
            <span>History</span>
        </button>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDEtBDUm2kPHwYh_tOxSF5OY-0esUoOBcs",
            authDomain: "task-quest-numair.firebaseapp.com",
            projectId: "task-quest-numair",
            storageBucket: "task-quest-numair.firebasestorage.app",
            messagingSenderId: "389105697902",
            appId: "1:389105697902:web:e3c644eba49704157ed27f",
            measurementId: "G-V5RHL2N8Z2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const tasks = [
            { id: 'task1', title: 'Send a sweet morning text ☀️', points: 10, type: 'standard' },
            { id: 'task2', title: 'Upload a cute selfie of today 🤳', points: 30, type: 'upload' },
            { id: 'task3', title: 'Tell me one thing you love about me today 🥰', points: 20, type: 'text-input' },
            { id: 'task4', title: 'Let me choose your outfit for our next date night 👗👠', points: 40, type: 'standard' }
        ];

        // Updated array incorporating the customized choices for 2, 4, and 5
        const rewards = [
            { id: 'reward1', title: '100 Rs in next Eidi ✉️', cost: 30, desc: 'A special bonus addition to your upcoming Eidi pouch!' },
            { id: 'reward2', title: 'Midnight Drive + Late Night Chai 🚗☕', cost: 50, desc: 'A quiet, winding cruise through the city lights, ending with a hot cup of tea together.' },
            { id: 'reward3', title: 'Buy a Ring 💍', cost: 100, desc: 'Pick out a gorgeous ring of your choice to add to your collection.' },
            { id: 'reward4', title: 'Weekend Getaway Planning Pass 🗺️✈️', cost: 150, desc: 'Sit back completely. I will plan, book, and handle all itineraries for our next short holiday together.' },
            { id: 'reward5', title: 'A Custom Premium Gift Package Box 🎁👑', cost: 300, desc: 'Unlock a beautifully curated gift collection box containing premium items you have had your eye on.' }
        ];

        let appData = { points: 0, completedTasks: {}, logs: [] };
        const docRef = doc(db, "questHub", "sharedState");

        onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
                appData = docSnap.data();
            } else {
                setDoc(docRef, appData);
            }
            updateUI();
        });

        window.switchTab = function(pageId, navButton) {
            document.querySelectorAll('.app-page').forEach(page => page.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(pageId).classList.add('active');
            navButton.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateUI() {
            document.getElementById('total-points').innerText = appData.points || 0;

            const tasksList = document.getElementById('tasks-list');
            tasksList.innerHTML = '';
            tasks.forEach(task => {
                const taskStatus = appData.completedTasks?.[task.id];
                const isCompleted = !!taskStatus;
                const card = document.createElement('div');
                card.className = 'card-item';

                let extraHTML = '';
                if (task.type === 'upload') {
                    if (!isCompleted) {
                        extraHTML = `
                            <div class="upload-container">
                                <label class="file-drop-zone" for="file-${task.id}">
                                    <span style="font-size:1.5rem; margin-bottom:4px;">📸</span>
                                    <span>Tap to choose today's memory</span>
                                    <input type="file" id="file-${task.id}" accept="image/*">
                                </label>
                                <img id="preview-${task.id}" class="preview-img" />
                            </div>
                        `;
                    } else {
                        extraHTML = `<img src="${taskStatus}" class="preview-img" style="display:block;" />`;
                    }
                } else if (task.type === 'text-input') {
                    if (!isCompleted) {
                        extraHTML = `
                            <div class="text-response-container">
                                <textarea id="text-input-${task.id}" class="love-text-box" placeholder="Write it here... ❤️"></textarea>
                            </div>
                        `;
                    } else {
                        extraHTML = `
                            <div class="saved-response-box">
                                "${taskStatus}"
                            </div>
                        `;
                    }
                }

                card.innerHTML = `
                    <div class="card-body">
                        <div class="item-info">
                            <h3>${task.title}</h3>
                            <span class="points-badge">+${task.points} PTS</span>
                        </div>
                        <button id="btn-${task.id}" ${isCompleted ? 'disabled' : ''}>
                            ${isCompleted ? '💖 Saved' : 'Complete'}
                        </button>
                    </div>
                    ${extraHTML}
                `;
                tasksList.appendChild(card);

                if (!isCompleted) {
                    if (task.type === 'upload') {
                        card.querySelector(`#file-${task.id}`).addEventListener('change', () => handleImageUpload(task.id));
                    }
                    card.querySelector(`#btn-${task.id}`).addEventListener('click', () => completeTask(task, task.points, task.type));
                }
            });

            const rewardsList = document.getElementById('rewards-list');
            rewardsList.innerHTML = '';
            rewards.forEach(reward => {
                const currentPoints = appData.points || 0;
                const canAfford = currentPoints >= reward.cost;
                const card = document.createElement('div');
                card.className = 'card-item';
                card.innerHTML = `
                    <div class="card-body">
                        <div class="item-info">
                            <h3>${reward.title}</h3>
                            <p>${reward.desc}</p>
                            <span class="points-badge" style="background:#fef3c7; color:#d97706; border-color: rgba(217,119,6,0.1);">${reward.cost} PTS</span>
                        </div>
                        <button ${!canAfford ? 'disabled' : ''} id="rew-${reward.id}" style="background:${canAfford ? 'linear-gradient(135deg, #d97706, #f59e0b)' : ''}; box-shadow: ${canAfford ? '0 6px 16px rgba(217,119,6,0.25)' : ''};">
                            🎁 Claim
                        </button>
                    </div>
                `;
                rewardsList.appendChild(card);
                if (canAfford) {
                    card.querySelector(`#rew-${reward.id}`).addEventListener('click', () => redeemReward(reward.title, reward.cost));
                }
            });

            const feedList = document.getElementById('feed-list');
            if(appData.logs && appData.logs.length > 0) {
                feedList.innerHTML = appData.logs.map(log => `
                    <div class="feed-card ${log.type || 'complete'}">
                        <span style="font-weight:600; color: #4c0519;">${log.text}</span>
                        <span class="feed-time">${log.time}</span>
                    </div>
                `).join('');
            } else {
                feedList.innerHTML = `<div class="feed-card" style="justify-content:center; color:#881337; opacity:0.7;">No milestones logged yet! ✨</div>`;
            }
        }

        let temporaryImageString = "";
        function handleImageUpload(taskId) {
            const fileInput = document.getElementById(`file-${taskId}`);
            const preview = document.getElementById(`preview-${taskId}`);
            const file = fileInput.files[0];

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    temporaryImageString = e.target.result; 
                }
                reader.readAsDataURL(file);
            }
        }

        async function completeTask(task, taskPoints, type) {
            let taskPayloadValue = true;
            let customLogText = `✨ Completed "${task.title}"`;

            if (type === 'upload') {
                if (!temporaryImageString) {
                    alert('Please choose a cute memory first!');
                    return;
                }
                taskPayloadValue = temporaryImageString;
                temporaryImageString = "";
            } else if (type === 'text-input') {
                const inputElement = document.getElementById(`text-input-${task.id}`);
                const userText = inputElement.value.trim();
                if (!userText) {
                    alert('Please write down your note first! 🥰');
                    return;
                }
                taskPayloadValue = userText;
                customLogText = `❤️ Shared: "${userText}"`;
            }

            const updatedCompleted = { ...(appData.completedTasks || {}) };
            updatedCompleted[task.id] = taskPayloadValue;

            const timeString = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            const newLog = { text: customLogText, time: timeString, type: 'complete' };
            const updatedLogs = [newLog, ...(appData.logs || [])].slice(0, 25);

            confetti({ particleCount: 140, spread: 65, colors: ['#ff3860', '#f472b6', '#fff1f2'], origin: { y: 0.7 } });

            await updateDoc(docRef, {
                points: (appData.points || 0) + taskPoints,
                completedTasks: updatedCompleted,
                logs: updatedLogs
            });
        }

        async function redeemReward(rewardTitle, cost) {
            if (appData.points >= cost) {
                const timeString = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const newLog = { text: `🌹 Claimed "${rewardTitle}"`, time: timeString, type: 'redeem' };
                const updatedLogs = [newLog, ...(appData.logs || [])].slice(0, 25);

                confetti({ particleCount: 180, spread: 100, colors: ['#ff3860', '#f59e0b', '#ffffff'] });

                await updateDoc(docRef, {
                    points: appData.points - cost,
                    logs: updatedLogs
                });
            }
        }

        document.getElementById('admin-reset-btn').addEventListener('click', async () => {
            if(confirm("Ready to drop new daily tasks? Your points balance won't change!")) {
                await updateDoc(docRef, { completedTasks: {} });
            }
        });
    </script>
</body>
</html>
